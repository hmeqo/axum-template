<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Placeholder</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f6f5f3;
                --fg: #1f2026;
                --accent: #5b5bd6;
                --ring: #1f2026;
                --selection: #5b5bd633;
                --focus: #5b5bd6;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #16171b;
                    --fg: #e9e9ee;
                    --accent: #a3a0f0;
                    --ring: #e9e9ee;
                    --selection: #a3a0f04d;
                    --focus: #a3a0f0;
                }
            }

            ::selection {
                background: var(--selection);
            }

            *:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 3px;
            }

            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                font-family: system-ui, "Segoe UI", sans-serif;
                background: var(--bg);
                color: var(--fg);
                line-height: 1.5;
            }

            .stage {
                max-width: 38rem;
                padding: 0 1.5rem;
                text-align: center;
            }

            .mark {
                width: 56px;
                height: 56px;
                color: var(--ring);
            }

            h1 {
                margin: 1.5rem 0 2.25rem;
                font-size: 1.75rem;
                letter-spacing: -0.02em;
                font-weight: 700;
            }

            .links {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.6rem;
            }

            .links a {
                color: var(--accent);
                text-decoration: none;
                font-weight: 550;
                padding: 0.4em 0.85em;
                border-radius: 10px;
                transition: background-color 160ms ease-out, color 160ms ease-out;
            }

            .links a:hover {
                background: color-mix(in srgb, var(--accent) 14%, transparent);
                color: var(--accent);
            }

            .links a:active {
                background: color-mix(in srgb, var(--accent) 22%, transparent);
            }

            .links a::after {
                content: "→";
                display: inline-block;
                margin-left: 0.5em;
                transition: transform 160ms ease-out;
            }

            .links a:hover::after {
                transform: translateX(2px);
            }

            .stage {
                animation: rise 480ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            @media (prefers-reduced-motion: reduce) {
                .stage {
                    animation: none;
                }
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
            }
        </style>
    </head>
    <body>
        <main class="stage">
            <svg class="mark" viewBox="0 0 56 56" aria-hidden="true">
                <circle cx="28" cy="28" r="21" fill="none" stroke="currentColor" stroke-width="1.5" />
                <path
                    d="M 17 20 C 26 12, 36 22, 40 34"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                />
                <circle cx="17" cy="20" r="3.5" fill="currentColor" />
                <circle cx="40" cy="34" r="3.5" fill="var(--accent)" />
            </svg>

            <h1>Default SPA placeholder</h1>

            <nav class="links" aria-label="Documentation">
                <a href="/api-docs/swagger-ui">Swagger UI</a>
                <a href="/api-docs/scalar">Scalar</a>
            </nav>
        </main>
    </body>
</html>
